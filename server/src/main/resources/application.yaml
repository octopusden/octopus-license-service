# The service is reached through the gateway, which strips its prefix and sends it as X-Forwarded-Prefix.
server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # The license registry's commit, its problems and licenses without text; nothing secret.
      show-details: always
      probes:
        enabled: true
      # Not ready until the license policy is loaded; liveness stays livenessState only, so a
      # Bitbucket outage never gets the pod restarted.
      group:
        readiness:
          include: readinessState,licenseRegistry

license-service:
  report-ttl: PT1H
  generation-threads: 4
  max-queued-reports: 50
  max-stored-bytes: 512MB
  # components-registry-url and exclusions come from Spring Cloud Config, where the component
  # names stay. Without components-registry-url the service does not start.
  # license-registry: bitbucket-url, token, project and repository come from Spring Cloud Config
  # and Vault; without any of them the service does not start.
  license-registry:
    refresh-interval: PT15M
    retry-interval: PT1M
  # jfrog: url and token come from Spring Cloud Config and Vault; ownership: internal-groups and
  # own-repository-prefixes from Spring Cloud Config, where company names stay. Without any of them
  # the service does not start.
  jfrog:
    xray-scan-timeout: PT5M
    xray-scan-poll-interval: PT10S
