# The service is reached through the gateway, which strips its prefix and sends it as X-Forwarded-Prefix.
server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # The license registry's commit, its problems and licenses without text; nothing secret.
      show-details: always
      probes:
        enabled: true
      # Not ready until the license policy is loaded; liveness stays livenessState only, so a
      # Bitbucket outage never gets the pod restarted.
      group:
        readiness:
          include: readinessState,licenseRegistry

license-service:
  report-ttl: PT1H
  generation-threads: 4
  max-queued-reports: 50
  max-stored-bytes: 512MB
  # The systems read are configured under the keys every service shares: components-registry-service.url,
  # bitbucket.host and artifactory.url in Spring Cloud Config's application.yml, bitbucket.token and
  # artifactory.token from Vault. Without any of them the service does not start.
  # From license-service.yml in Spring Cloud Config, where company names stay: exclusions,
  # license-registry project and repository, ownership internal-groups and own-repository-prefixes.
  # Without license-registry or ownership the service does not start.
  license-registry:
    refresh-interval: PT15M
    retry-interval: PT1M
  xray:
    scan-timeout: PT5M
    scan-poll-interval: PT10S
