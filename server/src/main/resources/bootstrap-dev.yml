spring:
  cloud:
    config:
      enabled: false

components-registry-service:
  url: ${COMPONENTS_REGISTRY_URL}

bitbucket:
  host: ${BITBUCKET_URL}
  token: ${BITBUCKET_TOKEN}

artifactory:
  url: ${JFROG_URL}
  token: ${JFROG_TOKEN}

license-service:
  license-registry:
    project: ${LICENSE_REGISTRY_PROJECT}
    repository: ${LICENSE_REGISTRY_REPOSITORY}
  ownership:
    internal-groups: ${INTERNAL_GROUPS}
    own-repository-prefixes: ${OWN_REPOSITORY_PREFIXES}
