name: Security Reports

# Pull requests run the same reusable workflow through merge-gate.yml, not this file.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # A job-level block replaces the token scope instead of extending it, so contents: read is
    # repeated here beside security-events: write.
    permissions:
      contents: read
      security-events: write
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@v3.4.1
    with:
      java-version: '25'
      # Must match merge-gate.yml: a different category makes GitHub treat PR and main analyses
      # as separate configurations.
      codeql-category: /license-service-codeql
      # Trivy cannot install while get.trivy.dev does not resolve, and this repository has no cached
      # binary. Re-enable once the shared workflow installs Trivy from its GitHub release.
      enable-trivy: false
