name: Gradle Release

on:
  repository_dispatch:
    types: [ release ]

# contents: write to create the tag and the GitHub release; packages: write to push the docker
# image to ghcr.io and core, client and the runner to GitHub Packages.
permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.4.1
    with:
      flow-type: hybrid
      java-version: '25'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      docker-image: license-service
      # Nothing goes to Maven Central: no project consumes core or client from there yet, the
      # response contract is still changing, and a Central version can never be replaced. All three
      # publications go to the shared GitHub Packages registry; the runner's -all jar could not go
      # to Central anyway.
      publish-to-nexus: false
      github-packages-publications: ":core:maven,:client:maven,:license-runner:maven"
      github-packages-repository: octopusden/octopus-maven-packages
      # With publish-to-nexus false nothing reaches Central, so a check-and-register workflow polling for
      # core there could never succeed. Register inside the release instead: that job needs the
      # build and the tag, so it still cannot outrun the deliverable.
      register-release-immediately: true
    secrets: inherit
